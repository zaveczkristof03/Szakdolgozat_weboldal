# Automatikus ellenőrzés minden feltöltésnél (push) és pull requestnél.
# Két feladat fut: a szerveroldali tesztek (pytest), illetve a kliensoldali ellenőrzések
# (kódelemzés, domain-tesztek, típusellenőrzés + build) és a böngészős tesztek (Playwright + axe).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  frontend:
    name: Frontend (lint, tesztek, build, böngészős tesztek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend előkészítése a böngészős tesztekhez
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python scripts/catalog_sync.py import
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Függőségek
        working-directory: frontend
        run: npm ci
      - name: Kódelemzés
        working-directory: frontend
        run: npm run lint
      - name: Domain-tesztek
        working-directory: frontend
        run: npm run test:domain
      - name: Típusellenőrzés és build
        working-directory: frontend
        run: npm run build
      - name: Böngésző telepítése
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Böngészős és akadálymentességi tesztek
        working-directory: frontend
        run: npm run test:e2e
      - name: Tesztjelentés feltöltése hiba esetén
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
